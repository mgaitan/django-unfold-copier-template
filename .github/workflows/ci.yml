name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint GitHub workflows
        uses: rhysd/actionlint@v1.7.9

      - name: Configure Git
        run: |
          git config --global user.name "Copier Bot"
          git config --global user.email "bot@example.com"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Template lint
        run: uv run ruff check .

      - name: Template tests
        run: uv run pytest -q

      - name: Template docs
        run: uv run --group docs sphinx-build docs docs/_build/html -b html -W

      - name: Generate project from template
        run: uv run copier copy --trust . test-project --defaults

      - name: Generated project QA
        working-directory: test-project
        run: make qa
